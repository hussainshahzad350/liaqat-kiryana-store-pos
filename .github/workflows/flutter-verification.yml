name: Flutter verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Record SDK
        run: flutter --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify generated translations
        run: |
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- lib/l10n
      - name: Check reviewed source inventory
        run: dart run tool/source_audit.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run full unit, widget and repository suite
        run: flutter test --no-pub
      - name: Run disposable Windows desktop smoke tests
        run: |
          flutter drive --debug --dart-define=INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=false --driver test/support/desktop_driver.dart --target test/desktop/desktop_smoke.dart -d windows --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release workflows and synthetic volume
        run: ./tool/verify_release.ps1
      - name: Build normal Windows application
        run: flutter build windows --debug --no-pub
